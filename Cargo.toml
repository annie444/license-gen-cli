[workspace]
resolver = "3"
members = ["license", "xtask"]
default-members = ["license"]

[workspace.dependencies]
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "std",
  "registry",
] }
clap = { version = "4.6", features = ["derive", "string"] }
clap-verbosity-flag = { version = "3.0", default-features = false, features = [
  "tracing",
] }
color-print = "0.3"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
